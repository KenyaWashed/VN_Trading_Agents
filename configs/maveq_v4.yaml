# MAVE-Q v4 (VetQuant-RSI) Configuration
# 10-Year Veteran CIO Cognitive Architecture + Free-Cloud Trainable Neuro-Symbolic Core (<15M @ T4, <4.5GB VRAM)
# Strictly Search-Zone Purged CV -> TRUE Zero-Validation-Burn (1 val query!) -> Superior Trial-Deflated DSR

model_name: "maveq_v4_vetquant_rsi"
seed: 2026
specialist_preset: "auto"  # auto | cpu_fast | kaggle_t4_optimal | kaggle_max_100m | cloud_a100_350m | tpu_v5e_350m

evolution:
  rounds: 6
  latent_candidates_per_round: 48
  screen_per_round: 10
  ucb_explore_fraction: 0.25
  max_ensemble_factors: 5
  max_member_corr: 0.65
  diffu_grpo_epochs_per_round: 10
  max_validation_queries: 1          # TRUE Zero-Validation-Burn: single search-CV champion sent to validation!
  mssf_windows: [1, 3, 5]            # Nyquist-matched causal filter bank (w <= horizon H=5, zero sign inversion)
  mssf_turnover_penalty: 0.16
  backbone_ridge_l2_frac: 0.15       # Sample-size-scaled KKT Non-Negative FWL Ridge regularization
  backbone_gp_turnover_exp: 0.50     # Garleanu-Pedersen (2013) square-root inverse-turnover damping

veteran_case_memory:
  enabled: true
  k_neighbors: 18
  exclusion_buffer_days: 10          # Unit-safe +/-10d purge inside search CV to prevent self-match leakage
  trauma_drop_threshold: -0.050      # Systemic 5d market crash threshold (<= -5.0%)
  floor_trauma_threshold: 0.10       # Broad multi-stock floor-lock contagion threshold (>= 10% universe)

